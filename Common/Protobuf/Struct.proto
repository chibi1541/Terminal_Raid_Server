// .proto 버전
syntax = "proto3";

// package name
package Protocol;

import "Enum.proto";

message User
{
	uint64 id = 1;
	string name = 2;
	PlayerColor color = 3;
}

message Vector2
{
	int32 x = 1;
	int32 y = 2;
}

// 전투 대상이 공유하는 상태. 플레이어와 몬스터가 그대로 같이 쓴다.
message CreatureState
{
	Vector2 pos = 1;
	int32 hp = 2;
	int32 maxHp = 3;
	DirectionType dir = 4;	// 현재 이동 방향. DIR_NONE = 정지
	int32 speed = 5;		// 서브유닛/초 (1셀 = 256). 늦게 접속한 클라가 움직이는 액터를 바로 예측할 수 있게
	int32 velSubX = 6;		// 임의 각도 속도 벡터 (서브유닛/초). 0 이면 위의 8방향 dir/speed 사용.
	int32 velSubY = 7;		// 투사체가 이 값으로 스폰 스냅샷을 받아 데드레커닝한다.
	int32 radius = 8;		// 충돌 반경 (셀). 클라 반경 원 시각화 + late-join 예측용.
}

// 이동 갱신 한 건. S_MOVE 가 배치로 싣는다.
message MoveInfo
{
	uint64 objectId = 1;
	Vector2 pos = 2;			// 권위 정수 셀 좌표 (late-join / 디버그 호환용)
	DirectionType dir = 3;
	int32 speed = 4;			// 서브유닛/초
	uint32 serverTick = 5;
	int32 posSubX = 6;			// 권위 위치 X, 서브유닛 고정소수점 (1셀 = 256). 원격 보간은 이 값을 쓴다.
	int32 posSubY = 7;
}

// 유저가 조종하는 플레이어 고유 정보.
// 위치나 체력처럼 몬스터도 갖는 값은 여기 두지 않는다.
message PlayerInfo
{
	// TODO : userid로 변경
	uint64 objectId = 1;
	string name = 2;
	CharacterType chartype = 3;	// 클라가 이 타입으로 CharacterData 를 조회해 스프라이트/스탯을 정한다
}

// 몬스터 고유 정보. 클라가 monsterType 으로 MonsterData 를 조회한다.
message MonsterInfo
{
	MonsterType monsterType = 1;
}

// 투사체 고유 정보. 클라가 projectileType 으로 ProjectileData 를 조회한다.
message ProjectileInfo
{
	ProjectileType projectileType = 1;
}

// 월드에 존재하는 개체 공통 정보. 스폰/디스폰 패킷이 사용한다.
// objectType(objectId 상위 16비트)에 따라 아래 셋 중 하나만 채운다.
message ObjectInfo
{
	uint64 objectId = 1;
	CreatureState state = 2;
	PlayerInfo player = 3;			// OBJECT_PLAYER
	MonsterInfo monster = 4;			// OBJECT_MONSTER
	ProjectileInfo projectile = 5;	// OBJECT_PROJECTILE
}

