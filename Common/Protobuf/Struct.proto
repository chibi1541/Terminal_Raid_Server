// .proto 버전
syntax = "proto3";

// package name
package Protocol;

import "Enum.proto";

message User
{
	uint64 id = 1;
	string name = 2;
	PlayerColor color = 3;
}

message Vector2
{
	int32 x = 1;
	int32 y = 2;
}

// 전투 대상이 공유하는 상태. 플레이어와 몬스터가 그대로 같이 쓴다.
message CreatureState
{
	Vector2 pos = 1;
	int32 hp = 2;
	int32 maxHp = 3;
	DirectionType dir = 4;	// 현재 이동 방향. DIR_NONE = 정지
	int32 speed = 5;		// 서브유닛/초 (1셀 = 256). 늦게 접속한 클라가 움직이는 액터를 바로 예측할 수 있게
}

// 이동 갱신 한 건. S_MOVE 가 배치로 싣는다.
message MoveInfo
{
	uint64 objectId = 1;
	Vector2 pos = 2;			// 권위 정수 셀 좌표
	DirectionType dir = 3;
	int32 speed = 4;			// 서브유닛/초
	uint32 serverTick = 5;
}

// 유저가 조종하는 플레이어 고유 정보.
// 위치나 체력처럼 몬스터도 갖는 값은 여기 두지 않는다.
message PlayerInfo
{
	// TODO : userid로 변경
	uint64 objectId = 1;
	string name = 2;
	CharacterType chartype = 3;
}

// 월드에 존재하는 개체 공통 정보. 스폰/디스폰 패킷이 사용한다.
message ObjectInfo
{
	uint64 objectId = 1;
	CreatureState state = 2;
	PlayerInfo player = 3;	// objectType == OBJECT_PLAYER 일 때만 채운다
}

