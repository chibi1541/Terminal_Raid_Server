// .proto 버전
syntax = "proto3";

// package name
package Protocol;

import "Enum.proto";

message User
{
	uint64 id = 1;
	string name = 2;
	PlayerColor color = 3;
}

message Vector2
{
	int32 x = 1;
	int32 y = 2;
}

// 전투 대상이 공유하는 상태. 플레이어와 몬스터가 그대로 같이 쓴다.
message CreatureState
{
	Vector2 pos = 1;
	int32 hp = 2;
	int32 maxHp = 3;
}

// 유저가 조종하는 플레이어 고유 정보.
// 위치나 체력처럼 몬스터도 갖는 값은 여기 두지 않는다.
message PlayerInfo
{
	// TODO : userid로 변경
	uint64 objectId = 1;
	string name = 2;
	CharacterType chartype = 3;
}

// 월드에 존재하는 개체 공통 정보. 스폰/디스폰 패킷이 사용한다.
message ObjectInfo
{
	uint64 objectId = 1;
	CreatureState state = 2;
	PlayerInfo player = 3;	// objectType == OBJECT_PLAYER 일 때만 채운다
}

// ---------------------------------------------------------------------------
// 아래는 이전 스네이크 프로젝트의 잔재. 참조하는 곳이 없다.
// 전투 패킷을 설계할 때 같이 정리한다.
// ---------------------------------------------------------------------------

message ActorInfo
{
	uint64 objectId = 1;
	Vector2 pos = 2;
}

message FieldData
{
	Vector2 pos = 1;
	uint32 fieldflag = 2;
}

message TrailData
{
	Vector2 pos = 1;
	DirectionType prevdir = 2;
	DirectionType curdir = 3;
}

message HeadData
{
	ActorInfo actor = 1;
	float moveSpeed = 2;
	DirectionType dir = 3;
	repeated TrailData trails = 4;
}
