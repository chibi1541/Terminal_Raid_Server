// .proto 버전
syntax = "proto3";

// package name
package Protocol;

enum ObjectType
{
	OBJECT_NONE = 0;
	OBJECT_ACTOR = 1;
	OBJECT_PLAYER = 2;
	OBJECT_MONSTER = 3;
	OBJECT_WALL = 4;
	OBJECT_PROJECTILE = 5;	// 직진 투사체
}

enum CharacterType
{
	CHARACTER_NONE = 0;
	CHARACTER_KNIGHT = 1;
	CHARACTER_ACHER = 2;
	CHARACTER_MAGE = 3;
}

enum DirectionType
{
	DIR_NONE = 0;
	DIR_LEFT = 1;
	DIR_RIGHT = 2;
	DIR_UP = 3;
	DIR_DOWN = 4;
	// 대각. 기존 값은 절대 바꾸지 말 것 (와이어 호환).
	DIR_UP_LEFT = 5;
	DIR_UP_RIGHT = 6;
	DIR_DOWN_LEFT = 7;
	DIR_DOWN_RIGHT = 8;
}

enum FieldType
{
	FIELD_GROUND = 0;
	FIELD_ITEM = 1;
	FIELD_OBSTACLE = 2; 
}

enum PlayerColor
{
	COLOR_WHITE = 0;
	COLOR_GREEN = 1;
	COLOR_RED = 2;
	COLOR_BLUE = 3;
	COLOR_CYAN = 4;
	COLOR_PURPLE = 5;
}