syntax = "proto3";

package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
	CharacterType charType = 2;	// 메뉴에서 고른 캐릭터. CHARACTER_NONE 이면 서버가 KNIGHT 로.
}

message S_LOGIN
{
	bool success = 1;
	User user = 2;
}

message C_PING
{
	uint64 clientTime = 1;	// 클라 송신 시각(ms, 클라 단조 시계). 서버는 해석하지 않고 그대로 돌려준다.
}

message S_PONG
{
	uint64 clientTime = 1;	// C_PING 의 값 그대로. 클라가 RTT = 수신시각 - clientTime 로 계산.
	uint64 serverTime = 2;	// 서버가 응답을 만든 시각(ms, 서버 단조 시계).
	uint32 serverTick = 3;	// 응답 시점의 룸 틱. 클라 보간/예측 시계의 기준.
}

message C_ENTER_ROOM
{

}

message S_ENTER_ROOM
{
	bool success = 1;
	uint32 width = 2;
	uint32 height = 3;
	ObjectInfo myObject = 4;
	repeated ObjectInfo objects = 5;	// 나를 제외한 룸 안의 기존 개체 전부
	uint32 serverTick = 6;			// 접속 시점의 서버 틱. 클라 시계 기준점
}

message C_EXIT_ROOM
{
	
}

message S_EXIT_ROOM
{
	
}

// 신규 패킷은 반드시 파일 맨 뒤에 추가할 것.
// GenPackets.exe 가 메시지 선언 순서대로 1000부터 ID를 매기기 때문에
// 중간에 끼워 넣으면 기존 패킷 ID가 전부 밀린다.

message S_SPAWN
{
	repeated ObjectInfo objects = 1;
	uint32 serverTick = 2;
}

message S_DESPAWN
{
	repeated uint64 objectIds = 1;
}

// 플레이어 이동 입력. 방향 홀드 모델 - 누르는 동안 그 방향, 떼면 DIR_NONE.
message C_MOVE
{
	uint32 inputSeq = 1;	// 클라가 증가시키는 입력 시퀀스. 서버가 마지막 처리분을 ack
	uint32 clientTick = 2;	// 입력을 만든 시점의 클라 단조 시계(ms). 서버가 직전 입력과의
							// 차이를 자기 실측 시간과 대조해 이동 시간 부풀리기를 검증한다.
	DirectionType dir = 3;	// 원하는 이동 방향. DIR_NONE = 정지
	// 4번 이후는 피드백 확장용 예약 : 클릭 이동 목표, 능력 입력, 바라보는 방향 등
}

// 이동 상태 브로드캐스트. 변경분 + 저빈도 키프레임을 틱당 한 번 배치로 싣는다.
message S_MOVE
{
	uint32 serverTick = 1;
	repeated MoveInfo moves = 2;
	uint32 deltaMs = 3;		// 이번 틱 실제 경과 시간(ms). 더 이상 고정 50ms를 가정하면 안 된다.
	uint64 serverTime = 4;	// 이 틱을 처리한 시각의 서버 단조 시계(ms). S_PONG.serverTime과 같은 시계.
}

// 이동을 요청한 플레이어에게만 보내는 ack. 클라 재조정(reconciliation)의 앵커.
message S_MOVE_ACK
{
	uint32 lastProcessedInputSeq = 1;
	uint32 serverTick = 2;
	Vector2 pos = 3;			// 권위 위치 (정수 셀). 디버그 / late-join 호환용.
	DirectionType dir = 4;
	int32 posSubX = 5;			// 권위 위치 X, 서브유닛 고정소수점 (1셀 = 256). 재조정 앵커는 이 값을 쓴다.
	int32 posSubY = 6;			// 정수 셀만 쓰면 서버의 셀 내부 위치가 잘려 왕복마다 최대 0.5칸씩 튄다.
}

// 피격 통지. 위치처럼 매 틱 바뀌는 게 아니라 "이 순간 한 번" 일어나는 것이라 S_MOVE와 분리한다.
message S_HIT
{
	uint64 targetId = 1;
	uint64 attackerId = 2;	// 없으면 0 (환경 데미지 등)
	int32 damage = 3;
	int32 newHp = 4;
	uint32 serverTick = 5;
	uint32 stunMs = 6;		// 피격 경직 시간(ms). 0 = 경직 없음(보스 등). 클라가 이 값으로 피격 상태를 유지.
}

// 사망 통지. hp가 0이 된 순간 한 번. 이 직후 곧바로 S_DESPAWN이 나간다 (Room::Leave 경로).
message S_DEATH
{
	uint64 objectId = 1;
	uint64 killerId = 2;	// 없으면 0
	uint32 serverTick = 3;
}

// 공격 모션 시작 통지. 데미지 판정과 무관하게 "이 순간 공격 모션을 재생하라"는 트리거만 알린다.
message S_ATTACK_START
{
	uint64 objectId = 1;
	DirectionType dir = 2;	// 바라보는 방향 (모션 방향)
	uint32 serverTick = 3;
}

// --- 디버그 오버레이 채널 ---
// 디버그를 켤 때만 트래픽이 흐른다. 개발/포트폴리오 시연용.

// 클라 → 서버 : 디버그 오버레이 on/off. 켜고 끌 때만 보낸다. 서버가 세션별로 기억한다.
message C_DEBUG_CONFIG
{
	bool wantLevelGrid = 1;	// 서버 충돌 격자 오버레이
	bool wantPaths = 2;		// 길찾기 경로/노드 오버레이
	bool wantQuadtree = 3;	// 쿼드트리 노드 + 액터 반경 원 + 충돌 타이밍 오버레이
}

// 서버 → 클라 : 서버가 보는 충돌 권위 격자. wantLevelGrid 를 켜는 순간, 행 밴드로 쪼개
// 여러 개가 온다 (서버 SendBuffer 청크 6000 / 클라 RecvBuffer 4096 제한).
message S_DEBUG_LEVEL
{
	uint32 width = 1;		// 셀 개수 (전체)
	uint32 height = 2;		// 셀 개수 (전체)
	uint32 tileSize = 3;	// 길찾기 타일 = tileSize × tileSize 셀
	uint32 startRow = 4;	// 이 청크가 담는 첫 행 (0 = 첫 청크 → 클라가 버퍼 재할당)
	uint32 rowCount = 5;	// 이 청크의 행 수
	bytes blockedBits = 6;	// 이 청크 로컬 비트. bit i = 셀 (startRow + i/width, i%width). 1 = 장애물
}

// 서버 → 클라 : 한 오브젝트의 길찾기 상태. 경로 설정 / 웨이포인트 전진 / 해제 시 전송.
message DebugPathNode
{
	Vector2 cell = 1;
}

message S_DEBUG_PATH
{
	uint64 objectId = 1;
	repeated DebugPathNode waypoints = 2;	// m.path 셀들. 비어 있으면 경로 없음
	uint32 currentIndex = 3;					// m.pathIndex (지금 향하는 웨이포인트)
	repeated DebugPathNode searchNodes = 4;	// JPS 가 open 에 넣은 점프 포인트 (탐색 흔적)
	bool cleared = 5;						// 경로 종료 통지
	uint32 boxCells = 6;					// 이 경로를 구운 액터의 충돌 박스 한 변(셀). 길찾기 팽창 = 이동 충돌 박스와 동일
	repeated DebugPathNode pathJumpNodes = 7;	// 최종 경로가 지나는 점프 포인트 (start..goal)
	uint32 expandedNodes = 8;				// 마지막 탐색이 확장(open pop)한 노드 수 (JPS=점프포인트, A*=셀)
	uint32 computeMicros = 9;				// 소요 시간 avg (us). pathalgo 전환 이후 repath 들의 평균
	uint32 pathAlgo = 10;					// 활성 길찾기 : 0=JPS 1=JPS_A 2=JPS_B 3=A*
	uint32 scannedNodes = 11;				// 마지막 탐색이 검사한 셀 수 (IsWalkable 호출). JPS 변종끼리 비교용
	uint32 computeMicrosMin = 12;			// 소요 시간 min (us). 전환 이후 최소
	uint32 computeMicrosMax = 13;			// 소요 시간 max (us). 전환 이후 최대
}

// 클라 -> 서버 : 공격(발사) 요청.
// muzzleCell / aimCell 은 클라가 화면->월드로 변환해서 보낸다 (카메라 회전이 클라에만 있으므로).
// 서버는 muzzle 을 플레이어 권위 위치 근처로 클램프한 뒤 방향/속도/스폰점을 파생한다.
message C_ATTACK
{
	Vector2 aimCell = 1;		// 마우스 커서의 월드 셀 좌표
	Vector2 muzzleCell = 2;		// 발사 기준점(플레이어 몸통 중심)의 월드 셀 좌표
	uint32 clientTimeMs = 3;	// 로컬 단조 시계 (쿨다운 / 순서)
}

// 쿼드트리 노드 하나의 셀 경계 (폐구간). S_DEBUG_QUADTREE 가 싣는다.
message DebugRect
{
	int32 minX = 1;
	int32 minY = 2;
	int32 maxX = 3;
	int32 maxY = 4;
}

// 서버 → 클라 : wantQuadtree 세션에게 ~5Hz. 쿼드트리 분할 + 충돌 처리 타이밍.
message S_DEBUG_QUADTREE
{
	repeated DebugRect nodes = 1;	// 개체를 품은(비어있지 않은) 노드들. 상한 256
	uint32 objectCount = 2;			// 트리에 들어간 살아있는 개체 수
	uint32 buildMicros = 3;			// 마지막 틱 RebuildCollisionTree(이동 반영분) 소요 us
	uint32 collisionMicros = 4;		// 마지막 틱 ResolveProjectileHits 소요 us
	uint32 serverTick = 5;
}

// 클라 → 서버 : 사망 후 리스폰 요청. 클라 사망 화면의 RESPAWN 버튼이 보낸다.
message C_RESPAWN
{
}

// 서버 → 클라 : 리스폰 통지. 부활한 개체의 전체 스냅샷을 실어 보낸다.
// 클라는 ApplyObjectInfo 로 위치/hp 를 흡수하고 사망 상태(isDead)를 해제한다. 본인 포함 전원에게.
message S_RESPAWN
{
	ObjectInfo object = 1;
	uint32 serverTick = 2;
}
